services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7.1.1315
    container_name: clickliv-ch
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: clickliv
      CLICKHOUSE_USER: clickliv
      CLICKHOUSE_PASSWORD: clickliv
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./docker/z-access.xml:/etc/clickhouse-server/users.d/z-access.xml:ro
      - ch-data:/var/lib/clickhouse
      - ch-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  clickstack:
    image: clickhouse/clickstack-all-in-one:latest
    container_name: clickliv-clickstack
    profiles: ["obs"]
    ports:
      - "8080:8080"
      - "4317:4317"
      - "4318:4318"
      - "8124:8123"
    volumes:
      - ./docker/clickstack-user.xml:/etc/clickhouse-server/users.d/clickliv.xml:ro
      - hdx-db:/data/db
      - hdx-data:/var/lib/clickhouse
      - hdx-logs:/var/log/clickhouse-server

volumes:
  ch-data:
  ch-logs:
  hdx-db:
  hdx-data:
  hdx-logs:
