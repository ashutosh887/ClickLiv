services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7.1.1315
    container_name: clickliv-ch
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: clickliv
      CLICKHOUSE_USER: clickliv
      CLICKHOUSE_PASSWORD: clickliv
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch-data:/var/lib/clickhouse
      - ch-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  ch-data:
  ch-logs:
