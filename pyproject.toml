[project]
name = "clickliv"
version = "0.1.0"
description = "Foreground-only concurrency for SonyLIV streaming telemetry, on ClickHouse"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
embedded = ["chdb>=4.2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clickliv"]
