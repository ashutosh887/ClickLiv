version: 1.3.13
cache: true

interface:
  customWelcome: 'ClickLiv concurrency desk. Ask about foreground concurrency on SonyLIV and the guardrailed marts tools will answer.'
  fileSearch: false

registration:
  socialLogins: []

mcpSettings:
  allowedAddresses:
    - 'host.docker.internal:8765'
    - 'clickhouse-mcp:8000'

mcpServers:
  clickliv-marts:
    type: streamable-http
    url: http://host.docker.internal:8765/mcp
    title: 'ClickLiv marts guardrailed'
    description: 'Pre vetted parameterized queries over the ClickLiv marts views. The model cannot emit SQL here.'
    timeout: 60000
    initTimeout: 15000
    startup: true
    chatMenu: true
    serverInstructions: |
      This is the default surface for every question about foreground concurrency,
      peaks, time series and top slices. Reach for concurrency_peak,
      concurrency_series, top_slices and list_dimensions before anything else.
      These tools run pre vetted parameterized queries against the ClickLiv marts
      views, so the numbers are the same ones the pipeline publishes.
      Always tell the user that the answer came from the guardrailed ClickLiv
      marts surface, and name the tool you called.

  clickhouse-official:
    type: streamable-http
    url: http://clickhouse-mcp:8000/mcp
    title: 'ClickHouse official read only'
    description: 'The official ClickHouse MCP server pointed at the ClickLiv Cloud service with write and drop access switched off.'
    timeout: 60000
    initTimeout: 15000
    startup: true
    chatMenu: true
    serverInstructions: |
      This is the escape hatch, not the default. Use it only when the guardrailed
      ClickLiv marts tools cannot express the question, for example schema
      exploration or an ad hoc aggregate that has no mart behind it. The
      connection is read only: writes and drops are refused by the server.
      Whenever you answer from here, say so plainly and show the SQL you ran, so
      the reader can tell an ad hoc query apart from a published mart.

endpoints:
  openAI:
    streamRate: 25
    titleConvo: true
    titleModel: 'gpt-5.2'
